# Quieter Spark driver logs for the POC (jobs print their own progress). Remove to get Spark's default INFO output.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n
logger.iceberg.name = org.apache.iceberg
logger.iceberg.level = warn
logger.authz.name = org.apache.kyuubi.plugin.spark.authz
logger.authz.level = info
logger.ranger.name = org.apache.ranger
logger.ranger.level = info
