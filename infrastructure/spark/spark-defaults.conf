# Spark configuration for the ETL / seeding jobs and the Jupyter notebook (service "spark").
# Legend:  [LOCAL]  value only valid for the Docker Compose POC
#          [PROD]   value or mechanism that changes on the production YARN/HDFS cluster
# Credentials are NOT in this file: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION are injected
# from infrastructure/.env into the container environment and picked up by Iceberg's S3FileIO (AWS SDK default chain).

# ---- execution ------------------------------------------------------------------------------------
# [LOCAL] PROD: yarn
spark.master                                     local[4]
# [LOCAL] PROD: 4g driver, see docs/infrastructure-sizing.md
spark.driver.memory                              2g
spark.driver.maxResultSize                       1g
# [LOCAL] unused in local mode; PROD: 5g (see sizing)
spark.executor.memory                            2g
# PROD: 2 cores/executor keeps GC and shuffle manageable at 1.3 GB RAM/core
spark.executor.cores                             2
# [LOCAL] PROD: true with shuffle tracking / external shuffle service
spark.dynamicAllocation.enabled                  false
spark.dynamicAllocation.shuffleTracking.enabled  true
# [LOCAL] PROD: 400 (≈ 2x total cores of the ETL queue)
spark.sql.shuffle.partitions                     8
spark.sql.adaptive.enabled                       true
spark.sql.adaptive.coalescePartitions.enabled    true
spark.serializer                                 org.apache.spark.serializer.KryoSerializer
# [LOCAL] PROD: yarn.nodemanager.local-dirs on local disks
spark.local.dir                                  /tmp/spark-local
spark.ui.showConsoleProgress                     false
# [LOCAL] PROD: true -> Spark History Server
spark.eventLog.enabled                           false

# ---- Iceberg + REST catalog ------------------------------------------------------------------------
spark.sql.extensions                             org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog                         lakehouse
spark.sql.catalog.lakehouse                      org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type                 rest
# [LOCAL] PROD: https://catalog.<corp>/catalog
spark.sql.catalog.lakehouse.uri                  http://lakekeeper:8181/catalog
spark.sql.catalog.lakehouse.warehouse            lakehouse
# [LOCAL] PROD on HDFS: org.apache.iceberg.hadoop.HadoopFileIO
spark.sql.catalog.lakehouse.io-impl              org.apache.iceberg.aws.s3.S3FileIO
# [LOCAL] not used on HDFS
spark.sql.catalog.lakehouse.s3.endpoint          http://minio:9000
# [LOCAL] not used on HDFS
spark.sql.catalog.lakehouse.s3.path-style-access true
# [LOCAL]
spark.sql.catalog.lakehouse.client.region        local-01
# PROD: catalog authentication (engine service principal, OAuth2 client-credentials against the IdP):
#   spark.sql.catalog.lakehouse.credential         <client-id>:<client-secret>   (from a secrets file, never here)
#   spark.sql.catalog.lakehouse.oauth2-server-uri  https://idp.<corp>/realms/lakehouse/protocol/openid-connect/token
#   spark.sql.catalog.lakehouse.scope              lakekeeper

# ---- Iceberg write behaviour -----------------------------------------------------------------------
spark.sql.iceberg.handle-timestamp-without-timezone true
spark.sql.sources.partitionOverwriteMode         dynamic
