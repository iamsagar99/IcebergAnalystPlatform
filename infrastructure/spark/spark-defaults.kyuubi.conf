# Spark configuration for the Spark SQL engines launched BY THE KYUUBI SERVER (one engine per user/group).
# Mounted at $SPARK_HOME/conf/spark-defaults.conf inside the kyuubi image. Analysts cannot change these:
# kyuubi-defaults.conf restricts spark.sql.extensions, spark.jars, etc. via kyuubi.session.conf.restrict.list.
# Legend: [LOCAL] POC-only value, [PROD] what changes on YARN/HDFS.

# ---- engine footprint ------------------------------------------------------------------------------
# [LOCAL] PROD: yarn (client mode, one AM per engine)
spark.master                                     local[2]
# [LOCAL] PROD: 4g (engine driver is long-lived, holds query plans/results)
spark.driver.memory                              768m
# caps result size shipped to the gateway (runaway SELECT *)
spark.driver.maxResultSize                       512m
# [PROD] ignored in local mode; see docs/infrastructure-sizing.md
spark.executor.memory                            4g
spark.executor.cores                             2
# [PROD] baseline; dynamic allocation scales within the queue
spark.executor.instances                         1
# [LOCAL] PROD: true
spark.dynamicAllocation.enabled                  false
# [PROD]
spark.dynamicAllocation.minExecutors             1
# [PROD] per-engine cap; the YARN queue caps the sum
spark.dynamicAllocation.maxExecutors             8
# [PROD]
spark.dynamicAllocation.executorIdleTimeout      120s
spark.dynamicAllocation.shuffleTracking.enabled  true
# [LOCAL] PROD: 200
spark.sql.shuffle.partitions                     8
spark.sql.adaptive.enabled                       true
spark.sql.adaptive.coalescePartitions.enabled    true
spark.serializer                                 org.apache.spark.serializer.KryoSerializer
spark.local.dir                                  /tmp/spark-local
spark.ui.showConsoleProgress                     false
# engine UIs: 4050, 4051, ... (ports published by the kyuubi service)
spark.ui.port                                    4050

# ---- workload guard-rails (P8) ---------------------------------------------------------------------
spark.sql.broadcastTimeout                       300
spark.sql.autoBroadcastJoinThreshold             32m
spark.task.maxFailures                           2
spark.sql.sources.partitionOverwriteMode         dynamic

# ---- Iceberg + REST catalog (identical to the ETL profile) ------------------------------------------
spark.sql.extensions                             org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.apache.kyuubi.plugin.spark.authz.ranger.RangerSparkExtension
spark.sql.defaultCatalog                         lakehouse
spark.sql.catalog.lakehouse                      org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type                 rest
# [LOCAL]
spark.sql.catalog.lakehouse.uri                  http://lakekeeper:8181/catalog
spark.sql.catalog.lakehouse.warehouse            lakehouse
# [LOCAL] PROD: HadoopFileIO on HDFS
spark.sql.catalog.lakehouse.io-impl              org.apache.iceberg.aws.s3.S3FileIO
# [LOCAL]
spark.sql.catalog.lakehouse.s3.endpoint          http://minio:9000
# [LOCAL]
spark.sql.catalog.lakehouse.s3.path-style-access true
# [LOCAL]
spark.sql.catalog.lakehouse.client.region        local-01
# PROD: spark.sql.catalog.lakehouse.credential / oauth2-server-uri as in spark-defaults.conf (engine principal "kyuubi-engine")

# ---- authorization: Kyuubi Spark AuthZ (Ranger) ----------------------------------------------------
# Policies come from ranger-spark-security.xml in $SPARK_HOME/conf (service name, admin URL, cache dir).
# Analysts cannot disable this: spark.sql.extensions and spark.sql.optimizer.excludedRules are restricted.
# blocks SELECT * FROM parquet.`s3://...` storage bypass
spark.sql.runSQLOnFiles                          false
