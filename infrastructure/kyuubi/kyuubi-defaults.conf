# Apache Kyuubi 1.12.0 server configuration (service "kyuubi").
# Legend: [LOCAL] POC-only, [PROD] production value/mechanism. Secrets come from kyuubi-env.sh / environment.

# ---- frontends ------------------------------------------------------------------------------------
kyuubi.frontend.protocols                       THRIFT_BINARY,REST
# bind on all interfaces inside the container (default = the container's eth0 address only, so localhost would be refused)
kyuubi.frontend.thrift.binary.bind.host          0.0.0.0
kyuubi.frontend.rest.bind.host                   0.0.0.0
# JDBC/Beeline: jdbc:hive2://<host>:10009/
kyuubi.frontend.thrift.binary.bind.port          10009
# REST API + Web UI
kyuubi.frontend.rest.bind.port                   10099
# [LOCAL] empty = no service discovery. PROD: zk1:2181,zk2:2181,zk3:2181 (HA, client load balancing)
kyuubi.ha.namespace                             kyuubi

# ---- authentication (P7) --------------------------------------------------------------------------
# [LOCAL] JDBC auth: users/passwords in the Postgres table kyuubi_auth.auth_users (seeded by infrastructure/catalog/init-postgres.sh)
# [PROD]  kyuubi.authentication=LDAP (kyuubi.authentication.ldap.url/baseDN/...) or KERBEROS; same AD groups as Trino.
kyuubi.authentication                           JDBC
kyuubi.authentication.jdbc.driver.class         org.postgresql.Driver
kyuubi.authentication.jdbc.url                  jdbc:postgresql://postgres:5432/kyuubi_auth
kyuubi.authentication.jdbc.query                SELECT 1 FROM auth_users WHERE username = ${user} AND password_hash = encode(sha256(convert_to(${password}, 'UTF8')), 'hex') AND enabled

# platform administrators: may list/close every user's sessions and engines via REST/UI (others see only their own)
kyuubi.server.administrators                    admin

# ---- engine sharing and pooling (P1/P8) ------------------------------------------------------------
kyuubi.engine.type                              SPARK_SQL
# default for analysts: one Spark engine per primary group (analysts, restricted_analysts)
kyuubi.engine.share.level                        GROUP
# groups resolved via Hadoop UGI -> infrastructure/hadoop/core-site.xml ([PROD] LDAP mapping)
kyuubi.session.group.provider                    hadoop
# default: no pool. Group "analysts" overrides below to a 2-engine pool
kyuubi.engine.pool.size                          -1
# [LOCAL] hard server-side cap on pool size. PROD: 9+ per sizing doc
kyuubi.engine.pool.size.threshold                4
# round-robin sessions across the pool
kyuubi.engine.pool.selectPolicy                  POLLING
# [LOCAL] engine self-terminates after 10 min idle. PROD: PT30M (JVM warm-up vs. capacity)
kyuubi.session.engine.idle.timeout               PT10M
kyuubi.session.engine.check.interval            PT1M
kyuubi.session.engine.initialize.timeout        PT3M
kyuubi.session.engine.launch.async              true
# shared engine, but temp views / SET values isolated per user
kyuubi.engine.user.isolated.spark.session        true
kyuubi.session.idle.timeout                     PT6H
# cap rows returned to a client per statement (runaway SELECT *)
kyuubi.operation.result.max.rows                 100000
# [LOCAL] default statement timeout. PROD: PT30M (interactive); batch group raises it per user
kyuubi.operation.query.timeout                   PT15M

# ---- analysts cannot change these session confs (authorization hardening) -------------------------
kyuubi.session.conf.restrict.list               spark.sql.extensions,spark.jars,spark.jars.packages,spark.files,spark.driver.extraClassPath,spark.executor.extraClassPath,spark.sql.optimizer.excludedRules,spark.sql.runSQLOnFiles,spark.driver.extraJavaOptions,spark.executor.extraJavaOptions,spark.hadoop.hadoop.user.group.static.mapping.overrides
kyuubi.session.conf.ignore.list                 spark.master,spark.submit.deployMode,spark.driver.memory,spark.executor.memory,spark.executor.instances,spark.dynamicAllocation.maxExecutors
# NOTE: kyuubi.session.user.sign.enabled stays at its default (false): with the AuthZ extension loaded, the engine's
# bootstrap SQL runs before any signed session exists and fails with "Invalid user identifier [null]" (verified, 1.12.0).
# Engine-side user spoofing is prevented instead by the engine being launched per user/group (proxy-user) by the server.

# ---- user / group placement: queues and share-level overrides (P8) --------------------------------
# Syntax: ___{username}___.{key}  (user-level defaults, applied when the engine is created)
# [LOCAL] spark.yarn.queue is carried into the engine conf but unused in local mode.
# [PROD]  the YARN queues are: etl (guaranteed 60%), interactive (30%), adhoc_heavy (10%), admin (preemptible from etl).
___admin___.kyuubi.engine.share.level           USER
___admin___.spark.yarn.queue                    admin
___etl___.kyuubi.engine.share.level             CONNECTION
___etl___.spark.yarn.queue                      etl
___analyst1___.spark.yarn.queue                 interactive
___analyst2___.spark.yarn.queue                 interactive
___restricted1___.spark.yarn.queue              interactive
___bench___.spark.yarn.queue                    interactive
___bench___.kyuubi.engine.share.level           USER
# the benchmark user gets a 2-engine pool to show pooling
___bench___.kyuubi.engine.pool.size              2

# ---- metrics ---------------------------------------------------------------------------------------
kyuubi.metrics.enabled                          true
kyuubi.metrics.reporters                        PROMETHEUS
kyuubi.metrics.prometheus.port                  10019
