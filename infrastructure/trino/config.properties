# Trino 484 coordinator (single-node: coordinator also schedules work on itself).
# [LOCAL] = POC-only, [PROD] = production change. Secrets via ${ENV:...} from the container environment.
coordinator=true
node-scheduler.include-coordinator=true
# [PROD] false; 1 coordinator + N workers (see docs/infrastructure-sizing.md)
# HTTP 8080 is NOT published outside the container: Trino refuses unauthenticated client requests on it
# (allow-insecure-over-http stays at its secure default). It only serves node discovery on localhost.
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=static

# ---- authentication (P7): clients must use HTTPS 8443 + password ---------------------------------
# [LOCAL] self-signed certificate generated by scripts/start.sh (trino/generated/trino.pem) + file password store.
# [PROD]  CA-issued certificate, http-server.authentication.type=OAUTH2 (OIDC) or PASSWORD backed by LDAP.
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/generated/trino.pem
http-server.authentication.type=PASSWORD
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
web-ui.enabled=true

# ---- memory (P8) --------------------------------------------------------------------------------
# JVM heap is 2 GB (jvm.config). Rules of thumb Trino applies: heap-headroom ~30%, query.max-memory-per-node
# must leave room for the headroom. [PROD] values are derived in docs/infrastructure-sizing.md.
query.max-memory=1GB
query.max-memory-per-node=700MB
memory.heap-headroom-per-node=500MB
query.max-total-memory=1200MB

# ---- spill to disk ------------------------------------------------------------------------------
# Lets a memory-heavy query continue past its memory limit by spilling to local disk instead of failing.
spill-enabled=true
spiller-spill-path=/data/trino/spill
spiller-max-used-space-threshold=0.8
max-spill-per-node=2GB
query-max-spill-per-node=1GB

# ---- runaway-query guard-rails (resource groups add concurrency and queueing) -------------------
query.max-execution-time=30m
query.max-run-time=45m
query.max-planning-time=2m
query.max-stage-count=100
query.max-history=500

# ---- metrics: /metrics (OpenMetrics) scraped by Prometheus ---------------------------------------
openmetrics.jmx-object-names=trino.execution:name=QueryManager|trino.execution:name=SqlTaskManager|trino.memory:name=ClusterMemoryManager|trino.memory:type=ClusterMemoryPool,name=general|trino.execution.resourcegroups:*|java.lang:type=Memory|java.lang:type=GarbageCollector,name=G1 Young Generation|java.lang:type=GarbageCollector,name=G1 Concurrent GC
