# Iceberg connector -> Lakekeeper REST catalog -> MinIO-compatible object storage.
# The catalog is named "lakehouse" in Trino AND in Spark/Kyuubi, so every query in sql/ runs unchanged on both engines.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=lakehouse
# [LOCAL] no catalog auth. [PROD] iceberg.rest-catalog.security=OAUTH2 + oauth2.credential=${ENV:TRINO_CATALOG_CREDENTIAL} + oauth2.server-uri
iceberg.rest-catalog.security=NONE
# Trino never asks the catalog for storage credentials; it uses its own service identity (like Kerberos on HDFS).
iceberg.rest-catalog.vended-credentials-enabled=false
iceberg.rest-catalog.view-endpoints-enabled=true

# ---- storage: native S3 file system ([PROD] on HDFS: fs.hadoop.enabled=true + hive.config.resources=core-site.xml,hdfs-site.xml)
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=${ENV:S3_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:ENGINE_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:ENGINE_S3_SECRET_KEY}

# ---- safety / maintenance policy (P3/P4): Spark owns ALL writes and maintenance; Trino is a read-only serving engine.
# Connector-level read-only security also closes a gap in the file-based system rules, which do not govern
# ALTER TABLE ... EXECUTE table procedures (optimize / expire_snapshots / remove_orphan_files) - verified on 484.
# [PROD] with Ranger/OPA as system access control this can be iceberg.security=system with per-user procedure policies.
iceberg.security=read_only
iceberg.expire-snapshots.min-retention=7d
iceberg.remove-orphan-files.min-retention=7d
iceberg.register-table-procedure.enabled=false
iceberg.add-files-procedure.enabled=false
iceberg.query-partition-filter-required=false
