# Overlay: Trino path.   docker compose -f docker-compose.yml -f docker-compose.trino.yml up -d trino
services:
  trino:
    image: trinodb/trino:484
    environment:
      TRINO_SHARED_SECRET: ${TRINO_SHARED_SECRET}
      ENGINE_S3_ACCESS_KEY: ${ENGINE_S3_ACCESS_KEY}
      ENGINE_S3_SECRET_KEY: ${ENGINE_S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
    ports:
      - "8443:8443"   # HTTPS: Trino CLI / JDBC / Web UI (password auth). Port 8080 (HTTP) is intentionally not published.
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/node.properties:/etc/trino/node.properties:ro
      - ./trino/log.properties:/etc/trino/log.properties:ro
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./trino/rules.json:/etc/trino/rules.json:ro
      - ./trino/resource-groups.properties:/etc/trino/resource-groups.properties:ro
      - ./trino/resource-groups.json:/etc/trino/resource-groups.json:ro
      - ./trino/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      - ./trino/group-provider.properties:/etc/trino/group-provider.properties:ro
      - ./trino/generated:/etc/trino/generated:ro      # password.db + groups.txt, generated by scripts/start.sh (git-ignored)
      - trino-data:/data/trino
    depends_on:
      catalog-init: { condition: service_completed_successfully }
    healthcheck:
      # the trino image has no grep: use shell pattern matching on the /v1/info JSON
      test: ["CMD-SHELL", "out=$$(curl -ksf https://localhost:8443/v1/info) && case \"$$out\" in *'\"starting\":false'*) exit 0;; esac; exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
    networks: [lakehouse]

volumes:
  trino-data:
